<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - BIT Mesra MCA Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
<style>
  body { font-family:'Inter',sans-serif; min-height:100vh; display:grid; place-items:center; background:#faf9f9; padding:56px 12px 24px; position:relative; overflow-x:hidden; }
  body::before { content:''; position:absolute; inset:0; background:radial-gradient(600px 300px at 15% 0%, rgba(200,16,46,0.10), transparent), radial-gradient(600px 300px at 85% 100%, rgba(159,18,57,0.10), transparent); pointer-events:none; }
  .login-card { width:100%; max-width:420px; background:#fff; border:1px solid #e2e8f0; border-radius:22px; box-shadow:0 20px 50px rgba(15,23,42,0.10); overflow:hidden; position:relative; z-index:1; }
  .login-head { background:linear-gradient(135deg,#881337,#9f1239); color:#fff; padding:22px 26px; }
  .bit-logo { width:40px; height:40px; border-radius:11px; background:rgba(255,255,255,0.16); border:1px solid rgba(255,255,255,0.3); display:grid; place-items:center; font-weight:800; font-size:0.82rem; letter-spacing:-0.03em; }
  .role-toggle { display:inline-flex; background:#f1f5f9; border-radius:999px; padding:4px; gap:4px; }
  .role-toggle button { border:none; background:transparent; padding:8px 20px; border-radius:999px; font-weight:700; font-size:0.86rem; color:#475569; transition:.15s; }
  .role-toggle button.active { background:#fff; color:#a30d26; box-shadow:0 2px 8px rgba(15,23,42,0.12); }
  .fld { width:100%; border:1.5px solid #e2e8f0; border-radius:12px; padding:11px 14px; font-size:0.92rem; outline:none; transition:.15s; }
  .fld:focus { border-color:#c8102e; box-shadow:0 0 0 4px rgba(200,16,46,0.10); }
  .btn-login { width:100%; border:none; border-radius:999px; padding:12px; font-weight:800; color:#fff; background:linear-gradient(135deg,#c8102e,#9f1239); box-shadow:0 10px 24px rgba(200,16,46,0.28); transition:.15s; }
  .btn-login:hover { transform:translateY(-1px); box-shadow:0 14px 30px rgba(200,16,46,0.34); }
  .demo-chip { display:flex; justify-content:space-between; align-items:center; gap:8px; width:100%; text-align:left; border:1px dashed #cbd5e1; background:#f8fafc; border-radius:10px; padding:8px 12px; font-size:0.8rem; transition:.12s; }
  .demo-chip:hover { border-color:#c8102e; background:#fff1f2; }
  .demo-chip .nm { font-weight:700; color:#0f172a; }
  .demo-chip .id { color:#64748b; }
  #err { display:none; }
</style>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%23c8102e%27/%3E%3Cpath d=%27M18 46V20l14 16 14-16v26%27 stroke=%27white%27 stroke-width=%276%27 fill=%27none%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E">
</head>
<body>
<div class="login-card">
  <div class="login-head">
    <div class="d-flex align-items-center gap-3">
      <div class="bit-logo">BIT</div>
      <div>
        <div style="font-weight:800; font-family:'Plus Jakarta Sans',sans-serif; letter-spacing:-0.03em;">BIT Mesra</div>
        <div style="font-size:0.75rem; opacity:0.85;">MCA Academic Dashboard - Login</div>
      </div>
      <a href="index.html" class="ms-auto" style="color:rgba(255,255,255,0.85); font-size:0.78rem; text-decoration:none;"><i class="fa-solid fa-arrow-left me-1"></i>Home</a>
    </div>
  </div>

  <div class="p-4">
    <div class="text-center mb-3">
      <div class="role-toggle" role="tablist">
        <button type="button" id="rStudent" class="active" onclick="setRole('student')"><i class="fa-solid fa-user-graduate me-1"></i>Student</button>
        <button type="button" id="rTeacher" onclick="setRole('teacher')"><i class="fa-solid fa-chalkboard-teacher me-1"></i>Teacher</button>
      </div>
    </div>

    <form id="loginForm" autocomplete="off">
      <label class="small fw-bold mb-1" id="idLabel">Email / Roll No.</label>
      <input id="identifier" class="fld mb-2" placeholder="Email address or student roll number">
      <label class="small fw-bold mb-1 mt-2">Password</label>
      <input id="password" type="password" class="fld" placeholder="Demo password: 1234" value="1234">
      <div id="err" class="mt-2 small" style="background:#fef2f2;border:1px solid #fecaca;color:#991b1b;border-radius:10px;padding:8px 12px;"></div>
      <button type="submit" class="btn-login mt-3" id="loginBtn"><i class="fa-solid fa-right-to-bracket me-2"></i><span id="loginBtnText">Login as Student</span></button>
    </form>

    <div class="mt-4">
      <div class="small fw-bold text-muted mb-2" style="letter-spacing:0.05em;font-size:0.68rem;">DEMO ACCOUNTS - SELECT AN ACCOUNT TO FILL THE LOGIN FORM</div>
      <div class="d-grid gap-2" id="demoList"></div>
    </div>

    <div class="text-center small text-muted mt-3" style="font-size:0.72rem;">
      <i class="fa-solid fa-wand-magic-sparkles me-1"></i>Demo accounts use password <code>1234</code>. Login is verified by the backend.
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js?v=loginfix4"></script>
<script>
  let role = new URLSearchParams(location.search).get('role') === 'teacher' ? 'teacher' : 'student';

  const demoAccounts = {
    student: [
      { name:'Manoj Kumar Das', id:'MCA/2024/017', email:'manoj.das@bitmesra.ac.in' },
      { name:'Priya Sharma',    id:'MCA/2024/018', email:'priya.sharma@bitmesra.ac.in' },
      { name:'Aman Verma',      id:'MCA/2024/019', email:'aman.verma@bitmesra.ac.in' },
      { name:'Neha Singh',      id:'MCA/2024/020', email:'neha.singh@bitmesra.ac.in' }
    ],
    teacher: [
      { name:'Prof. Rajesh Kumar', id:'Faculty - CA Dept', email:'rajesh.kumar@bitmesra.ac.in' },
      { name:'Dr. Anjali Mehta',   id:'Faculty - CA Dept', email:'anjali.mehta@bitmesra.ac.in' }
    ]
  };

  function setRole(r){
    role = r;
    document.getElementById('rStudent').classList.toggle('active', r==='student');
    document.getElementById('rTeacher').classList.toggle('active', r==='teacher');
    document.getElementById('loginBtnText').textContent = r==='student' ? 'Login as Student' : 'Login as Teacher';
    document.getElementById('idLabel').textContent = r==='student' ? 'Email / Roll No.' : 'Email';
    renderDemo();
  }

  function renderDemo(){
    const list = document.getElementById('demoList');
    list.innerHTML = demoAccounts[role].map(a=>`
      <button type="button" class="demo-chip" onclick="fillDemo('${a.email}')">
        <span><span class="nm">${a.name}</span> <span class="id">• ${a.id}</span></span>
        <span class="text-muted"><i class="fa-solid fa-arrow-right"></i></span>
      </button>`).join('');
  }

  function fillDemo(email){
    document.getElementById('identifier').value = email;
    document.getElementById('password').value = '1234';
    document.getElementById('err').style.display='none';
  }

  function showErr(msg){
    const e = document.getElementById('err');
    e.textContent = msg; e.style.display='block';
  }

  document.getElementById('loginForm').addEventListener('submit', async ev=>{
    ev.preventDefault();
    const btn = document.getElementById('loginBtn');
    const orig = btn.innerHTML;
    btn.disabled = true; btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Logging in...';
    try{
      const user = await API.authenticate(document.getElementById('identifier').value, role, document.getElementById('password').value);
      const verifiedUser = await API.getMe();
      if (verifiedUser.id !== user.id || verifiedUser.role !== user.role) throw new Error('The session could not be verified. Please try again.');
      window.location.href = 'dashboard.html?role=' + user.role;
    }catch(e){ showErr(e.message || 'Login failed'); }
    finally{ btn.disabled = false; btn.innerHTML = orig; }
  });

  setRole(role);
  // already logged in? offer to continue
  try{
    const cur = JSON.parse(localStorage.getItem('mca_current_user')||'null');
    if(cur){
      const bar=document.createElement('div');
      bar.className='alert d-flex justify-content-between align-items-center';
      bar.style.cssText='position:fixed;top:10px;left:10px;right:10px;z-index:50;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;background:#f0fdf4;border:1px solid #bbf7d0;color:#166534;border-radius:14px;padding:8px 12px;font-size:0.82rem;box-shadow:0 10px 30px rgba(15,23,42,0.12);';
      bar.innerHTML='<span><i class="fa-solid fa-circle-check me-1"></i>Logged in as <b>'+cur.name+'</b></span><a class="btn btn-sm text-white ms-3" style="background:#166534;padding:4px 14px;text-decoration:none;" href="'+('dashboard.html?role='+cur.role)+'">Continue →</a>';
      document.body.appendChild(bar);
    }
  }catch{}
</script>
  <footer class="legal-strip"><span>MCA Academic Dashboard &copy; 2026, Department of Computer Applications, BIT Mesra (demo project).</span><span class="ms-auto"><a href="privacy.html" rel="noopener">Privacy Policy</a> &middot; <a href="terms.html" rel="noopener">Terms</a></span></footer>
</body></html>
