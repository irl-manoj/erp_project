<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account - BIT Mesra MCA Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root{--maroon:#9f1239;--red:#c8102e;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0}
  *{box-sizing:border-box} body{font-family:Inter,sans-serif;min-height:100vh;margin:0;display:grid;place-items:center;padding:30px 12px;background:radial-gradient(700px 380px at 10% 0%,rgba(200,16,46,.10),transparent),radial-gradient(700px 380px at 90% 100%,rgba(159,18,57,.10),transparent),#faf9f9;color:var(--ink)}
  .card-register{width:100%;max-width:520px;background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 20px 50px rgba(15,23,42,.1);overflow:hidden}
  .head{background:linear-gradient(135deg,#881337,var(--maroon));color:white;padding:23px 26px}.logo{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);display:grid;place-items:center;font-weight:800}
  .field{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:11px 13px;font-size:.92rem;outline:none}.field:focus{border-color:var(--red);box-shadow:0 0 0 4px rgba(200,16,46,.1)}
  .role-picker{display:flex;gap:8px}.role-option{flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px;color:#475569;font-weight:700}.role-option.active{border-color:#fda4af;background:#fff1f2;color:var(--maroon)}
  .submit{width:100%;border:0;border-radius:999px;padding:12px;color:white;font-weight:800;background:linear-gradient(135deg,var(--red),var(--maroon));box-shadow:0 10px 24px rgba(200,16,46,.22)}
  .hint{font-size:.78rem;color:var(--muted)} #error{display:none}
</style>
</head>
<body>
<main class="card-register">
  <header class="head"><div class="d-flex align-items-center gap-3"><div class="logo">BIT</div><div><div style="font:800 1rem 'Plus Jakarta Sans',sans-serif">BIT Mesra</div><div class="small opacity-75">MCA Academic Dashboard · Create account</div></div><a href="login.html" class="ms-auto small text-white text-decoration-none"><i class="fa-solid fa-arrow-left me-1"></i>Sign in</a></div></header>
  <div class="p-4 p-md-5">
    <h1 class="h4 fw-bold mb-1">Create your account</h1><p class="text-secondary small mb-4">Your account will be stored securely in the academic portal.</p>
    <div class="mb-3"><div class="small fw-bold mb-2">ACCOUNT TYPE</div><div class="role-picker" role="group" aria-label="Account type"><button type="button" id="studentRole" class="role-option active" onclick="setRole('student')"><i class="fa-solid fa-user-graduate me-1"></i>Student</button><button type="button" id="teacherRole" class="role-option" onclick="setRole('teacher')"><i class="fa-solid fa-chalkboard-teacher me-1"></i>Teacher</button></div></div>
    <form id="registerForm" novalidate>
      <label class="small fw-bold mb-1" for="fullName">Full name</label><input id="fullName" class="field mb-3" autocomplete="name" required maxlength="100" placeholder="Your full name">
      <label class="small fw-bold mb-1" for="email">Institutional email</label><input id="email" type="email" class="field mb-3" autocomplete="email" required maxlength="254" placeholder="name@example.edu">
      <div id="studentFields"><div class="row g-3"><div class="col-sm-7"><label class="small fw-bold mb-1" for="roll">Student roll number</label><input id="roll" class="field" maxlength="30" placeholder="MCA/2026/001"></div><div class="col-sm-5"><label class="small fw-bold mb-1" for="semester">Semester</label><select id="semester" class="field"><option value="1">Semester 1</option><option value="2">Semester 2</option><option value="3">Semester 3</option><option value="4">Semester 4</option></select></div></div></div>
      <div id="teacherFields" class="d-none"><label class="small fw-bold mb-1" for="inviteCode">Teacher invitation code</label><input id="inviteCode" type="password" class="field" autocomplete="off" placeholder="Provided by the portal administrator"><div class="hint mt-1">Teacher sign-up is invitation-only. Contact your administrator for a code.</div></div>
      <div class="mt-3"><label class="small fw-bold mb-1" for="password">Password</label><input id="password" type="password" class="field" autocomplete="new-password" required minlength="8" maxlength="128" placeholder="At least 8 characters"><div class="hint mt-1">Use at least 8 characters.</div></div>
      <div class="mt-3"><label class="small fw-bold mb-1" for="confirmPassword">Confirm password</label><input id="confirmPassword" type="password" class="field" autocomplete="new-password" required minlength="8" maxlength="128" placeholder="Enter the password again"></div>
      <div id="error" class="alert alert-danger py-2 px-3 mt-3 small" role="alert"></div>
      <button class="submit mt-3" id="submitBtn" type="submit"><i class="fa-solid fa-user-plus me-2"></i>Create account</button>
    </form>
    <div class="text-center small text-secondary mt-3">Already registered? <a href="login.html" class="fw-bold text-decoration-none" style="color:var(--maroon)">Sign in</a></div>
  </div>
</main>
<script src="js/config.js"></script>
<script src="js/api.js?v=register2"></script>
<script>
  let accountRole='student';
  function setRole(role){
    accountRole=role;
    document.getElementById('studentRole').classList.toggle('active',role==='student');
    document.getElementById('teacherRole').classList.toggle('active',role==='teacher');
    document.getElementById('studentFields').classList.toggle('d-none',role!=='student');
    document.getElementById('teacherFields').classList.toggle('d-none',role!=='teacher');
  }
  document.getElementById('registerForm').addEventListener('submit',async event=>{
    event.preventDefault();
    const error=document.getElementById('error'); error.style.display='none';
    const name=document.getElementById('fullName').value.trim();
    const email=document.getElementById('email').value.trim();
    const password=document.getElementById('password').value;
    if(password!==document.getElementById('confirmPassword').value){error.textContent='Passwords do not match.';error.style.display='block';return;}
    const payload={name,email,password,role:accountRole};
    if(accountRole==='student'){payload.roll=document.getElementById('roll').value.trim();payload.semester=Number(document.getElementById('semester').value);}
    else payload.inviteCode=document.getElementById('inviteCode').value;
    const button=document.getElementById('submitBtn');button.disabled=true;button.textContent='Creating account…';
    try{
      const user=await API.register(payload);
      window.location.replace('dashboard.html?role='+encodeURIComponent(user.role));
    }catch(exception){error.textContent=exception.message||'Account registration failed.';error.style.display='block';}
    finally{button.disabled=false;button.innerHTML='<i class="fa-solid fa-user-plus me-2"></i>Create account';}
  });
</script>
</body>
</html>
